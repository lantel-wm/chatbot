use_default_settings: true

general:
  debug: false
  instance_name: "Caster Chatbot Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  method: "GET"
  secret_key: "replace-with-a-random-local-secret"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 10.0
  extra_proxy_timeout: 10
  proxies:
    "all://":
      - http://192.168.5.2:1087
