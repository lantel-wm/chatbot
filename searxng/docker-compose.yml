services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: caster-chatbot-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:${SEARXNG_PORT:-8888}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-replace-with-a-random-local-secret}"
    volumes:
      - "./settings.yml:/etc/searxng/settings.yml:ro"
      - "./cache:/var/cache/searxng"
